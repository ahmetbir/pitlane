# Example nginx vhost for the game (replace pitlane.example.com with your
# PUBLIC_HOST from deploy/deploy.env, and the certificate paths with yours).
# Cloudflare (proxied, TLS strict, origin cert) -> this vhost -> the live
# pitlane color (pitlane-blue or pitlane-green), reached by its name on
# the shared docker network (no published port) via docker's DNS (127.0.0.11).
# Cloudflare ranges fetched 2026-10-06 from https://www.cloudflare.com/ips-v4
# and https://www.cloudflare.com/ips-v6; refresh when Cloudflare changes them.
# The same list appears twice (geo below and set_real_ip_from); keep both
# in sync.
#
# Source restriction: with real_ip active, allow/deny would test the
# *client* address, not the connecting peer. So the check uses a geo map on
# $realip_remote_addr (the TCP peer before real_ip rewrites it).
# This file is included in the http{} context (geo is http-level).

geo $realip_remote_addr $pitlane_from_cf {
    default 0;
    127.0.0.1 1;
    173.245.48.0/20 1;
    103.21.244.0/22 1;
    103.22.200.0/22 1;
    103.31.4.0/22 1;
    141.101.64.0/18 1;
    108.162.192.0/18 1;
    190.93.240.0/20 1;
    188.114.96.0/20 1;
    197.234.240.0/22 1;
    198.41.128.0/17 1;
    162.158.0.0/15 1;
    104.16.0.0/13 1;
    104.24.0.0/14 1;
    172.64.0.0/13 1;
    131.0.72.0/22 1;
    2400:cb00::/32 1;
    2606:4700::/32 1;
    2803:f800::/32 1;
    2405:b500::/32 1;
    2405:8100::/32 1;
    2a06:98c0::/29 1;
    2c0f:f248::/32 1;
}

server {
    listen 80;
    server_name pitlane.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name pitlane.example.com;

    ssl_certificate     /etc/nginx/certs/pitlane-origin.pem;
    ssl_certificate_key /etc/nginx/certs/pitlane-origin-key.pem;

    # Cloudflare per-hostname Authenticated Origin Pulls (optional, off in
    # this sample: the certificate file must exist or `nginx -t` fails).
    # Upload your own client certificate + key for this hostname in
    # Cloudflare (SSL/TLS → Origin Server → Authenticated Origin Pulls →
    # per-hostname), put the certificate (public part only) here, then only
    # Cloudflare presenting it reaches the app. Uncomment the first two lines,
    # check $ssl_client_verify == SUCCESS through Cloudflare, then the `if`.
    # ssl_client_certificate /etc/nginx/certs/pitlane-aop.pem;
    # ssl_verify_client optional;
    # if ($ssl_client_verify != SUCCESS) { return 403; }
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Client IP from Cloudflare; X-Real-IP below then carries it upstream.
    real_ip_header CF-Connecting-IP;
    real_ip_recursive off;
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;

    # Only Cloudflare (and local checks) may reach this server_name.
    if ($pitlane_from_cf = 0) {
        return 403;
    }

    client_max_body_size 1k;

    # Resolve per request, so nginx starts and reloads while pitlane is down.
    resolver 127.0.0.11 valid=10s ipv6=off; # IPv4 only: -trust-proxy is the IPv4 edge subnet
    # The live blue/green color. scripts/deploy.sh rewrites this one line in
    # place (deploy/switch-upstream.sh) and reloads: keep it on one line, in
    # exactly this form, and nowhere else in the file.
    set $pitlane_upstream http://pitlane-blue:8080;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;

    location /ws {
        proxy_pass $pitlane_upstream;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering off;
    }

    location / {
        proxy_pass $pitlane_upstream;
    }
}
